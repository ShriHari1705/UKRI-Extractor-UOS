version: 2

models:
  - name: mart_keyword_tags
    description: "Long-format mart — one row per project × keyword pair. Foundation for all downstream queries."
    columns:
      - name: PROJECT_ID
        tests: [not_null]
      - name: KEYWORD
        tests: [not_null]
      - name: CATEGORY
        tests:
          - accepted_values:
              arguments:
                values: ['ML_AI', 'HPC_Simulation', 'Data_Intensive', 'Cloud_Infrastructure']

  - name: mart_early_warning_signal
    description: "One row per project with compute_score, priority tier, and starting_soon flag. Primary BI table."
    columns:
      - name: PROJECT_ID
        tests: [not_null, unique]
      - name: COMPUTE_SCORE
        tests: [not_null]
      - name: PRIORITY
        tests:
          - accepted_values:
              arguments:
                values: ['Critical', 'High', 'Medium', 'Low', 'None']

  - name: mart_rpi_funding_landscape
    description: "One row per project across all UKRI funders. Powers the RPI Growth Manager dashboard tab."
    columns:
      - name: PROJECT_ID
        tests: [not_null, unique]
      - name: LEAD_FUNDER
        tests: [not_null]

  - name: mart_rpi_keyword_tags
    description: "Long-format mart — one row per project × keyword pair, across all UKRI funders. Sibling of mart_keyword_tags without the Innovate UK restriction."
    columns:
      - name: PROJECT_ID
        tests: [not_null]
      - name: KEYWORD
        tests: [not_null]
      - name: CATEGORY
        tests:
          - accepted_values:
              arguments:
                values: ['ML_AI', 'HPC_Simulation', 'Data_Intensive', 'Cloud_Infrastructure']

  - name: mart_category_growth_trends
    description: "One row per category × quarter. Growth rate vs. each category's own trailing 4-quarter baseline."
    columns:
      - name: CATEGORY
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ML_AI', 'HPC_Simulation', 'Data_Intensive', 'Cloud_Infrastructure']
      - name: QUARTER
        tests: [not_null]
